name: Goatman and pairing fixture diagnosis

on:
  push:
    branches: [diagnostics/goatman-late-knock-39df986]

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: goatman-1, namespace: the_oldest_house_selected, method: 'GoatmanExteriorTests#theFinishedCamperKeepsItsOriginalMovingFromEveningThroughDawnWithSimultaneousDoorPressure', expected: 1, heap: 3g}
          - {label: goatman-2, namespace: the_oldest_house_selected, method: 'GoatmanExteriorTests#theFinishedCamperKeepsItsOriginalMovingFromEveningThroughDawnWithSimultaneousDoorPressure', expected: 1, heap: 3g}
          - {label: goatman-3, namespace: the_oldest_house_selected, method: 'GoatmanExteriorTests#theFinishedCamperKeepsItsOriginalMovingFromEveningThroughDawnWithSimultaneousDoorPressure', expected: 1, heap: 3g}
          - {label: pairing-1, namespace: the_oldest_house_selected, method: 'UncannyTests#theFarOriginalTakesHeavyPhysicalStridesButFreezesWithoutAnotherImpactAtGreen', expected: 1, heap: 3g}
          - {label: pairing-2, namespace: the_oldest_house_selected, method: 'UncannyTests#theFarOriginalTakesHeavyPhysicalStridesButFreezesWithoutAnotherImpactAtGreen', expected: 1, heap: 3g}
          - {label: pairing-3, namespace: the_oldest_house_selected, method: 'UncannyTests#theFarOriginalTakesHeavyPhysicalStridesButFreezesWithoutAnotherImpactAtGreen', expected: 1, heap: 3g}
          - {label: goatman-suite, namespace: 'the_oldest_house_goatman,the_oldest_house_wake,the_oldest_house_nightward,the_oldest_house_goatman_windows,the_oldest_house_goatman_entry,the_oldest_house_goatman_meal', method: '', expected: 53, heap: 6g}
          - {label: uncanny-suite, namespace: the_oldest_house_uncanny, method: '', expected: 56, heap: 3g}
    env:
      JAVA_TOOL_OPTIONS: -Dthe_oldest_house.traceLateKnock=true
      NATIVE_CASE_NAMESPACE: ${{ matrix.namespace }}
      NATIVE_CASE_METHOD: ${{ matrix.method }}
      NATIVE_CASE_EXPECTED: ${{ matrix.expected }}
      NATIVE_CASE_HEAP: ${{ matrix.heap }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Verify bounded fixture changes
        run: |
          mkdir -p build
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os, re, subprocess
          base='39df9862a98f19e74463dee25435b3b87c1478af'
          traced={
              'src/main/java/io/github/knaitoe/theoldesthouse/labyrinth/GoatmanStalking.java',
              'src/main/java/io/github/knaitoe/theoldesthouse/gametest/GoatmanExteriorTests.java',
          }
          pairing='src/main/java/io/github/knaitoe/theoldesthouse/gametest/UncannyTests.java'
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          assert changed == traced | {pairing,'.github/workflows/build.yml'}, changed
          for name in traced:
              original=subprocess.check_output(['git','show',base+':'+name],text=True)
              actual=Path(name).read_text()
              stripped=re.sub(r'^ *// (LATE_TRACE|FIXTURE_SEED)_BEGIN\n.*?^ *// (LATE_TRACE|FIXTURE_SEED)_END\n','',actual,flags=re.M|re.S)
              assert stripped == original, 'Only gated logs and the one native RNG seed may differ: '+name
          assert hashlib.sha256(Path(pairing).read_bytes()).hexdigest()=='7126049731be9b5f6159e6f7536536ce8c9db65e80a7135db94503ac4ac01da4'
          original=subprocess.check_output(['git','show',base+':'+pairing],text=True)
          assert re.findall(r'@GameTest\([^\n]*\)',original)==re.findall(r'@GameTest\([^\n]*\)',Path(pairing).read_text()), 'Native cases and deadlines must remain exact.'
          # The selector validates byte identity before registering its original function.
          if os.environ['NATIVE_CASE_METHOD'].startswith('UncannyTests#'):
              old=Path('src/main/resources/data/the_oldest_house_uncanny/structure/empty.nbt')
              copy=Path('src/main/resources/data/the_oldest_house_selected/structure/uncanny.nbt')
              copy.write_bytes(old.read_bytes())
          Path('build/source-provenance.txt').write_text('Base: '+base+'\nCandidate: '+subprocess.check_output(['git','rev-parse','HEAD'],text=True)+'Production timing and all original Goatman assertions are retained; pairing waits for real native delivery within the original deadline.\n')
          PY
      - name: Run native fixtures
        run: |
          set -o pipefail
          timeout --signal=QUIT --kill-after=20s 14m gradle runGameTestServer "-PgameTestNamespaces=$NATIVE_CASE_NAMESPACE" "-PgameTestMethods=$NATIVE_CASE_METHOD" -PgameTestDirectory=run-late-knock "-PgameTestHeap=$NATIVE_CASE_HEAP" --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx512m 2>&1 | tee build/native-fixtures.log
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          expected=int(os.environ['NATIVE_CASE_EXPECTED'])
          log=Path('build/native-fixtures.log').read_text()
          completed=re.findall(r'(\d+) GAME TESTS COMPLETE',log)
          assert completed and int(completed[-1])==expected
          assert f'All {expected} required tests passed' in log
          assert 'Game test server shutting down' in log
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-${{ matrix.label }}
          path: |
            build/native-fixtures.log
            build/source-provenance.txt
            run-late-knock/logs/latest.log
            run-late-knock/crash-reports/
          if-no-files-found: warn
