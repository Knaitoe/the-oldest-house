          completed=re.findall(r'All (\d+) required tests passed',Path('build/seam-native.log').read_text())
          declared=len(re.findall(r'@GameTest\s*\(',Path('src/main/java/io/github/knaitoe/theoldesthouse/gametest/SeamDoorTests.java').read_text()))
          assert declared==4 and completed and int(completed[-1])==declared, (completed,declared)
          jars=[p for p in Path('build/libs').glob('the_oldest_house-*.jar') if not p.stem.endswith(('-sources','-javadoc'))]
          assert len(jars)==1, jars
          jar=jars[0]
          with zipfile.ZipFile(jar) as z:
              assert z.testzip() is None
              assert 'version="0.4.68"' in z.read('META-INF/neoforge.mods.toml').decode().replace(' ', '')
              assert 'io/github/knaitoe/theoldesthouse/gametest/SeamDoorTests.class' in z.namelist()
              assert 'io/github/knaitoe/theoldesthouse/gametest/MultiplayerStoryTests.class' in z.namelist()
              assert 'io/github/knaitoe/theoldesthouse/gametest/PlaytestCommandTests.class' in z.namelist()
              assert 'io/github/knaitoe/theoldesthouse/gametest/SceneSupportTests.class' in z.namelist()
              assert 'io/github/knaitoe/theoldesthouse/gametest/SceneReviewTests.class' in z.namelist()
              assert 'io/github/knaitoe/theoldesthouse/labyrinth/SceneReview.class' in z.namelist()
              for name in ('Farmstead','WellSequence','WellCoverBlock','WellCoverBlockEntity'):
                  assert f'io/github/knaitoe/theoldesthouse/labyrinth/{name}.class' in z.namelist()
              for name in ('WellCoverRenderer','WellBreathing','WellVisualProof'):
                  assert f'io/github/knaitoe/theoldesthouse/client/{name}.class' in z.namelist()
              assert z.read('assets/the_oldest_house/sounds/well/breath.ogg').startswith(b'OggS')
              assert 'the_oldest_house:well_cover' in json.loads(z.read('data/minecraft/tags/block/climbable.json'))['values']
              stone = json.loads(z.read('assets/the_oldest_house/models/block/well_carvings.json'))
              assert stone['textures']['stone'] == 'minecraft:block/mossy_cobblestone' and len(stone['elements']) > 30
              assert 'assets/the_oldest_house/blockstates/vignette_detail.json' in z.namelist()
              assert 'io/github/knaitoe/theoldesthouse/labyrinth/CarcassHunt.class' in z.namelist()
              assert 'assets/the_oldest_house/blockstates/forest_cover.json' in z.namelist()
              for i in range(16):
                  assert f'assets/the_oldest_house/textures/block/zampano_scribble_{i}.png' in z.namelist()
              assert 'assets/the_oldest_house/textures/entity/costume_scarecrow.png' in z.namelist()
              assert 'io/github/knaitoe/theoldesthouse/labyrinth/SceneSupportRepairs.class' in z.namelist()
              assert 'io/github/knaitoe/theoldesthouse/command/PlaytestCommands.class' in z.namelist()
              assert 'io/github/knaitoe/theoldesthouse/gametest/CaverInteractionTests.class' in z.namelist()
              assert 'data/the_oldest_house_caver/structure/empty.nbt' in z.namelist()
              assert 'io/github/knaitoe/theoldesthouse/labyrinth/StaircaseStory.class' in z.namelist()
              assert 'io/github/knaitoe/theoldesthouse/labyrinth/StaircaseLeaves.class' in z.namelist()
              assert 'io/github/knaitoe/theoldesthouse/labyrinth/HallVariations.class' in z.namelist()
              assert 'io/github/knaitoe/theoldesthouse/network/BurnEmbersPayload.class' in z.namelist()
              assert 'io/github/knaitoe/theoldesthouse/client/HouseInteriorEffects.class' in z.namelist()
              assert 'io/github/knaitoe/theoldesthouse/labyrinth/StaircaseNotes.class' in z.namelist()
              assert z.read('assets/the_oldest_house/sounds/staircase/descent.ogg').startswith(b'OggS')
              assert 'data/the_oldest_house_exploration/structure/empty.nbt' in z.namelist()
              for cue in ('pipes','stone','settle'):
                  assert z.read(f'assets/the_oldest_house/sounds/hall/{cue}.ogg').startswith(b'OggS')
              assert 'io/github/knaitoe/theoldesthouse/labyrinth/SceneCraft.class' in z.namelist()
              assert 'io/github/knaitoe/theoldesthouse/labyrinth/StaircaseProse.class' in z.namelist()
              assert 'data/the_oldest_house_multiplayer/structure/empty.nbt' in z.namelist()
          jar.with_name(jar.name+'.sha256').write_text(hashlib.sha256(jar.read_bytes()).hexdigest()+'  '+jar.name+'\n')
          print(f'All {declared} native seam cases passed. This candidate still requires the complete suite and client proofs.')
          PY
      - name: Publish failed seam tests
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          log = Path('build/seam-native.log')
          if not log.exists():
              print('::error title=Failed seam test::no log was written')
              raise SystemExit(0)
          lines = log.read_text(errors='replace').splitlines()
          keys = re.compile(r'(failed at|required tests failed|Exception|Caused by|assert)')
          picked = []
          for i, line in enumerate(lines):
              if keys.search(line) and 'Node.js' not in line:
                  text = re.sub(r'^\[[^]]*\] \[[^]]*\] \[[^]]*\]: ', '', line).strip()
                  entry = (text + ' :: ' + ' | '.join(l.strip() for l in lines[i + 1:i + 3]))[:900]
                  if entry not in picked:
                      picked.append(entry)
          for entry in picked[:9]:
              print('::error title=Failed seam test::' + entry.replace('%', '%25'))
          PY

      - name: Upload seam diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seam-diagnostics-${{ github.sha }}
          path: build/seam-native.log
      - name: Upload focused candidate
        uses: actions/upload-artifact@v4
        with:
          name: seam-candidate-${{ github.sha }}
          path: |
            build/libs/the_oldest_house-0.4.68.jar
            build/libs/the_oldest_house-0.4.68.jar.sha256
          if-no-files-found: error


  staircase-gameplay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Focused native staircase entrance and upgrades
        timeout-minutes: 9
        env:
          JAVA_TOOL_OPTIONS: -Xmx4g
        run: |
          mkdir -p build run
          printf 'view-distance=3\nsimulation-distance=3\n' > run/server.properties
          set -o pipefail
          timeout --signal=QUIT --kill-after=20s 8m gradle runGameTestServer -PgameTestNamespaces=the_oldest_house_staircase --no-daemon -Dorg.gradle.jvmargs=-Xmx512m 2>&1 | tee build/staircase-native.log
          python3 - <<'PY_CHECK'
          import re
          from pathlib import Path
          declared=len(re.findall(r'@GameTest\s*\(',Path('src/main/java/io/github/knaitoe/theoldesthouse/gametest/StaircaseAccessTests.java').read_text()))
          completed=re.findall(r'All (\d+) required tests passed',Path('build/staircase-native.log').read_text())
          assert declared==10 and completed and int(completed[-1])==declared, (completed,declared)
          print(f'All {declared} native staircase entrance cases passed.')
          PY_CHECK
      - name: Upload staircase diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staircase-diagnostics-${{ github.sha }}
          path: build/staircase-native.log

