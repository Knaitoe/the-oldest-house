name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build
        run: gradle build

      # Generates The Oldest House on a game-test server and checks its
      # architecture (sightline, enclosure, walkability, glazing). The log
      # also carries an OTH-DUMP block listing for offline rendering.
      - name: Structure game tests
        timeout-minutes: 12
        run: |
          (sleep 540; jps -l | awk '/net.minecraft.gametest.Main/ {print $1}' | xargs -r -n 1 jstack) &
          diagnostic=$!
          trap 'kill "$diagnostic" 2>/dev/null || true' EXIT
          timeout --signal=QUIT --kill-after=20s 11m gradle runGameTestServer --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: the-oldest-house-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
