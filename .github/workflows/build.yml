name: Entrance placement and full boundary regression
on:
  push:
    branches: [fix/entrance-playtest-0.4.142]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile and run all original quiet-room cases plus real entrance and cross_hall paths
        run: |
          set -o pipefail
          mkdir -p build
          timeout --signal=QUIT --kill-after=20s 11m gradle build runGameTestServer -PgameTestNamespaces=the_oldest_house_house_read -PgameTestHeap=3g --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx768m 2>&1 | tee build/entrance-native.log
          python3 - <<'CHECK'
          from pathlib import Path
          log=Path('build/entrance-native.log').read_text()
          assert 'All 9 required tests passed' in log
          assert 'Game test server shutting down' in log
          CHECK
      - name: Prove the full-tick regression catches the original missing boundary
        run: |
          set -o pipefail
          python3 - <<'MUTATE'
          from pathlib import Path
          p=Path('src/main/java/io/github/knaitoe/theoldesthouse/labyrinth/LabyrinthDoors.java')
          s=p.read_text();Path('/tmp/entrance-fixed.java').write_text(s)
          old='        if(HouseReadSites.contains(player)){\n            STEPS.remove(player.getUUID());\n            return true;\n        }\n'
          assert s.count(old)==1
          p.write_text(s.replace(old,''))
          MUTATE
          set +e
          timeout --signal=QUIT --kill-after=20s 6m gradle runGameTestServer -PgameTestNamespaces=the_oldest_house_selected '-PgameTestMethods=EntrancePlaytestTests#fiveRealDoorsPrecedeTheMazeAndEveryPrivateRoomSurvivesTheFullHouseTick' -PgameTestDirectory=run-boundary-before -PgameTestHeap=3g --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx768m 2>&1 | tee build/boundary-before.log
          status=${PIPESTATUS[0]}
          set -e
          cp /tmp/entrance-fixed.java src/main/java/io/github/knaitoe/theoldesthouse/labyrinth/LabyrinthDoors.java
          test "$status" -ne 0
          python3 - <<'CHECK'
          from pathlib import Path
          log=Path('build/boundary-before.log').read_text()
          assert 'idle owner and observer remain in recognized House space after the fade' in log,log[-12000:]
          CHECK
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: entrance-boundary-native
          path: |
            build/entrance-native.log
            build/boundary-before.log
            build/libs/*.jar
            run/logs/latest.log
            run-boundary-before/logs/latest.log
          if-no-files-found: warn
