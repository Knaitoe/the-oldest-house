name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build
        id: build_mod
        run: gradle build

      - name: Verify writing atlas structure
        run: |
          python3 -m pip install Pillow
          python3 tools/verify_writing_fonts.py
          python3 tools/verify_textures.py

      - name: Verify playtest journey measurements
        run: python3 -m unittest discover -s tools -p test_summarize_playtest_log.py -v

      - name: Verify playable package
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          jars = list(pathlib.Path('build/libs').glob('the_oldest_house-*.jar'))
          runtime = [p for p in jars if not p.stem.endswith(('-sources', '-javadoc'))]
          assert len(runtime) == 1, runtime
          jar = runtime[0]
          with zipfile.ZipFile(jar) as z:
              for name in z.namelist():
                  if name.endswith('.json'):
                      json.loads(z.read(name))
              for name in ('assets/the_oldest_house/blockstates/chalk_mark.json',
                           'assets/the_oldest_house/blockstates/trail_line.json',
                           'assets/the_oldest_house/models/item/chalk.json',
                           'assets/the_oldest_house/models/item/trail_spool.json',
                           'data/the_oldest_house/recipe/chalk.json',
                           'data/the_oldest_house/recipe/trail_spool.json',
                           'assets/the_oldest_house/textures/entity/finale_materials.png',
                           'data/the_oldest_house/loot_modifiers/finale_notes.json'):
                  assert name in z.namelist(), name
              assert 'version="0.4.68"' in z.read('META-INF/neoforge.mods.toml').decode().replace(' ', '')
              assert 'io/github/knaitoe/theoldesthouse/house/PlaytestLog.class' in z.namelist()
              assert 'io/github/knaitoe/theoldesthouse/labyrinth/ExpeditionRhythm.class' in z.namelist()
              hall = json.loads(z.read('assets/the_oldest_house/blockstates/hall_change.json'))['variants']
              assert len(hall) == 24
              for mesh in ('picture','picture_turned','rug','rug_folded','lamp','lamp_off'):
                  assert len(json.loads(z.read(f'assets/the_oldest_house/models/block/hall_{mesh}.json'))['elements']) >= 4
              assert 'io/github/knaitoe/theoldesthouse/gametest/SeamDoorTests.class' in z.namelist()
              assert 'io/github/knaitoe/theoldesthouse/gametest/MultiplayerStoryTests.class' in z.namelist()
              assert 'io/github/knaitoe/theoldesthouse/gametest/PlaytestCommandTests.class' in z.namelist()
              assert 'io/github/knaitoe/theoldesthouse/gametest/SceneSupportTests.class' in z.namelist()
              assert 'io/github/knaitoe/theoldesthouse/gametest/SceneReviewTests.class' in z.namelist()
              assert 'io/github/knaitoe/theoldesthouse/labyrinth/SceneReview.class' in z.namelist()
              for name in ('Farmstead','WellSequence','WellCoverBlock','WellCoverBlockEntity'):
                  assert f'io/github/knaitoe/theoldesthouse/labyrinth/{name}.class' in z.namelist()
              for name in ('WellCoverRenderer','WellBreathing','WellVisualProof'):
                  assert f'io/github/knaitoe/theoldesthouse/client/{name}.class' in z.namelist()
              assert z.read('assets/the_oldest_house/sounds/well/breath.ogg').startswith(b'OggS')
              assert 'the_oldest_house:well_cover' in json.loads(z.read('data/minecraft/tags/block/climbable.json'))['values']
              stone = json.loads(z.read('assets/the_oldest_house/models/block/well_carvings.json'))
              assert stone['textures']['stone'] == 'minecraft:block/mossy_cobblestone' and len(stone['elements']) > 30
              assert 'assets/the_oldest_house/blockstates/vignette_detail.json' in z.namelist()
              assert 'io/github/knaitoe/theoldesthouse/labyrinth/CarcassHunt.class' in z.namelist()
              assert 'assets/the_oldest_house/blockstates/forest_cover.json' in z.namelist()
              for i in range(16):
                  assert f'assets/the_oldest_house/textures/block/zampano_scribble_{i}.png' in z.namelist()
              assert 'assets/the_oldest_house/textures/entity/costume_scarecrow.png' in z.namelist()
              assert 'io/github/knaitoe/theoldesthouse/labyrinth/SceneSupportRepairs.class' in z.namelist()
              assert 'io/github/knaitoe/theoldesthouse/command/PlaytestCommands.class' in z.namelist()
              assert 'io/github/knaitoe/theoldesthouse/gametest/CaverInteractionTests.class' in z.namelist()
              assert 'data/the_oldest_house_caver/structure/empty.nbt' in z.namelist()
              assert 'io/github/knaitoe/theoldesthouse/labyrinth/StaircaseStory.class' in z.namelist()
              assert 'io/github/knaitoe/theoldesthouse/labyrinth/StaircaseLeaves.class' in z.namelist()
              assert 'io/github/knaitoe/theoldesthouse/labyrinth/HallVariations.class' in z.namelist()
              assert 'io/github/knaitoe/theoldesthouse/network/BurnEmbersPayload.class' in z.namelist()
              assert 'io/github/knaitoe/theoldesthouse/client/HouseInteriorEffects.class' in z.namelist()
              assert 'io/github/knaitoe/theoldesthouse/labyrinth/StaircaseNotes.class' in z.namelist()
              for name in ('holloway_shield', 'holloway_shield_blocking', 'lighter'):
                  assert f'assets/the_oldest_house/models/item/{name}.json' in z.namelist()
              for name in ('holloway_shield', 'lighter'):
                  assert f'assets/the_oldest_house/textures/item/{name}.png' in z.namelist()
              assert 'io/github/knaitoe/theoldesthouse/client/ExpeditionItemModels.class' in z.namelist()
              assert z.read('assets/the_oldest_house/sounds/staircase/descent.ogg').startswith(b'OggS')
              assert 'data/the_oldest_house_exploration/structure/empty.nbt' in z.namelist()
              for cue in ('pipes','stone','settle'):
                  assert z.read(f'assets/the_oldest_house/sounds/hall/{cue}.ogg').startswith(b'OggS')
              assert 'io/github/knaitoe/theoldesthouse/labyrinth/SceneCraft.class' in z.namelist()
              assert 'io/github/knaitoe/theoldesthouse/labyrinth/StaircaseProse.class' in z.namelist()
              assert 'data/the_oldest_house_multiplayer/structure/empty.nbt' in z.namelist()
              correspondence = json.loads(z.read('data/the_oldest_house/correspondence/letters.json'))
              assert len(correspondence) == 108 and len({n['id'] for n in correspondence}) == 108
              sources = json.loads(z.read('data/the_oldest_house/correspondence/novel_sources.json'))
              assert len(sources) == 46 and len({n['id'] for n in sources}) == 46
              assert 'io/github/knaitoe/theoldesthouse/house/NovelCorrespondence.class' in z.namelist()
              assert 'assets/the_oldest_house/font/johnny.json' in z.namelist()
              assert 'assets/the_oldest_house/textures/font/johnny.png' in z.namelist()
              assert 'io/github/knaitoe/theoldesthouse/gametest/CollectedCorrespondenceTests.class' in z.namelist()
              for name in ('ClassicsVignettes', 'ClassicsRooms', 'ClassicsRegistry', 'ClassicsTexts', 'SeanceActor', 'WallpaperPanelBlock'):
                  assert f'io/github/knaitoe/theoldesthouse/labyrinth/{name}.class' in z.namelist()
              assert 'io/github/knaitoe/theoldesthouse/gametest/ClassicsTests.class' in z.namelist()
              for name in ('HotelVignette','HotelRooms','HotelRegistry','HotelTexts','HotelActor','HotelHose','HotelPropBlock','BlindStretch'):
                  assert f'io/github/knaitoe/theoldesthouse/labyrinth/{name}.class' in z.namelist()
              assert 'io/github/knaitoe/theoldesthouse/gametest/HotelTests.class' in z.namelist()
              for name in ('LiteraryVignettes','LiteraryRooms','LiteraryRegistry','LiteraryTexts','LiteraryActor','LiteraryElk','LiteraryCopies','LiteraryCabinChoices','LiteraryFrozenBlock','LiteraryModelBlockEntity','CabinBargain','CabinScreen','BodyLoss','SnowGlobeItem','GoatmanHaunt','TallyCounterItem'):
                  assert f'io/github/knaitoe/theoldesthouse/labyrinth/{name}.class' in z.namelist()
              for name in ('LiteraryTests',):
                  assert f'io/github/knaitoe/theoldesthouse/gametest/{name}.class' in z.namelist()
              assert 'io/github/knaitoe/theoldesthouse/client/LiteraryEffectsVisualProof.class' in z.namelist()
              literary = json.loads(z.read('assets/the_oldest_house/blockstates/literary_prop.json'))['variants']
              assert len(literary) == 384
              for name in ('elk_tooth','wheel_house_key','father_knife','grasshopper_jar','literary_photograph','family_film','father_meal','family_stew','wax_cylinder_one','wax_cylinder_two','wax_cylinder_three'):
                  mesh=json.loads(z.read(f'assets/the_oldest_house/models/item/{name}.json'))
                  assert len(mesh['elements']) >= 2 and 'display' in mesh
              for name in ('cylinder_one','cylinder_two','cylinder_three','family_film','party','blizzard','drip','giggle','scratch','hooves'):
                  assert z.read(f'assets/the_oldest_house/sounds/literary/{name}.ogg').startswith(b'OggS')
              # The cabin bargain (0.4.51): original cues, the two globes, the given arm and the stump's bandage.
              for name in ('cabin_knock','cabin_heart','cabin_cord','cabin_chop','cabin_wet','cabin_ring','cabin_wind','globe_shake','globe_cracked','cabin_gale'):
                  assert z.read(f'assets/the_oldest_house/sounds/literary/{name}.ogg').startswith(b'OggS')
              for name in ('cabin_snow_globe','cabin_cracked_snow_globe','cabin_given_arm'):
                  mesh=json.loads(z.read(f'assets/the_oldest_house/models/item/{name}.json'))
                  assert len(mesh['elements']) >= 2 and 'display' in mesh
              assert z.read('assets/the_oldest_house/textures/entity/arm_stump_bandage.png').startswith(b'\x89PNG')
              # The cabin storm (0.4.52): its rain and leaves are particles of its own.
              for name in ('cabin_rain','cabin_leaf'):
                  assert json.loads(z.read(f'assets/the_oldest_house/particles/{name}.json'))['textures']
              for name in ('BodyLossClient','CabinStormClient','CabinWeatherParticles'):
                  assert f'io/github/knaitoe/theoldesthouse/client/{name}.class' in z.namelist()
              # The Goatman's night (0.4.53): the counter, the brat, copper motes, the thing itself and four cues.
              for name in ('click','claw','crickets','keen','hammer','laugh','woods'):
                  assert z.read(f'assets/the_oldest_house/sounds/goatman/{name}.ogg').startswith(b'OggS')
              for name in ('textures/item/tally_counter.png','textures/item/goatman_brat.png','textures/entity/goatman.png','textures/entity/goatman_eyes.png','textures/particle/goatman_copper_0.png'):
                  assert z.read(f'assets/the_oldest_house/{name}').startswith(b'\x89PNG')
              assert json.loads(z.read('assets/the_oldest_house/particles/goatman_copper.json'))['textures']
              for name in ('tally_counter','goatman_brat'):
                  assert json.loads(z.read(f'assets/the_oldest_house/models/item/{name}.json'))['textures']['layer0']
              for name in ('GoatmanFigureModel','GoatmanFigureRenderer','GoatmanParticles'):
                  assert f'io/github/knaitoe/theoldesthouse/client/{name}.class' in z.namelist()
              # The Whalestoe institute (0.4.66): twelve numbered pigeonholes and the self-addressed envelope.
              assert len(json.loads(z.read('assets/the_oldest_house/blockstates/pigeonhole.json'))['variants']) == 48
              for n in range(1, 13):
                  assert z.read(f'assets/the_oldest_house/textures/block/pigeonhole_{n}.png').startswith(b'\x89PNG')
                  assert json.loads(z.read(f'assets/the_oldest_house/models/block/pigeonhole_{n}.json'))['textures']['front'] == f'the_oldest_house:block/pigeonhole_{n}'
              assert json.loads(z.read('assets/the_oldest_house/models/item/self_addressed_envelope.json'))['textures']['layer0']
              for name in ('WhaleInstitute','PigeonholeBlock','SelfAddressedEnvelopeItem'):
                  assert f'io/github/knaitoe/theoldesthouse/labyrinth/{name}.class' in z.namelist()
              # Proofrock (0.4.67): the town's signboards and school fittings, and the teachers' desks.
              assert len(json.loads(z.read('assets/the_oldest_house/blockstates/town_fixture.json'))['variants']) == 256
              assert len(json.loads(z.read('assets/the_oldest_house/blockstates/institute_sign.json'))['variants']) == 48
              assert len(json.loads(z.read('assets/the_oldest_house/blockstates/trailer_cooler.json'))['variants']) == 16
              assert len(json.loads(z.read('assets/the_oldest_house/blockstates/vehicle_wheel.json'))['variants']) == 16
              assert len(json.loads(z.read('assets/the_oldest_house/blockstates/notice_post.json'))['variants']) == 4
              for cls in ('NoticePostBlock','NoticePostBlockEntity','InstituteSignBlock','PlaytestFixes'):
                  assert f'io/github/knaitoe/theoldesthouse/labyrinth/{cls}.class' in z.namelist()
              for kind in ('post','outgoing','hours','writing','room_1','room_2','room_3','room_4','room_5','room_6','room_8','missing'):
                  assert z.read(f'assets/the_oldest_house/textures/block/institute_{kind}.png').startswith(b'\x89PNG')
              assert len(json.loads(z.read('assets/the_oldest_house/blockstates/school_desk.json'))['variants']) == 4
              for sign in ('general','post','laundry','hardware','sheriff','diner','cinema','bait','hall','motel','garage','school'):
                  for panel in 'lmr':
                      assert z.read(f'assets/the_oldest_house/textures/block/town_sign_{sign}_{panel}.png').startswith(b'\x89PNG')
                      assert json.loads(z.read(f'assets/the_oldest_house/models/block/town_fixture_{sign}_{panel}.json'))['textures']
              for name in ('locker','locker_top','locker_side','chalkboard_l','chalkboard_m','chalkboard_r','trophy_case','school_crest','bleacher','missing_poster','student_desk_wood','student_desk_metal','school_desk_front','school_desk_top'):
                  assert z.read(f'assets/the_oldest_house/textures/block/{name}.png').startswith(b'\x89PNG')
              assert json.loads(z.read('assets/the_oldest_house/models/block/school_desk.json'))['textures']
              for name in ('ProofrockTown','IndianLakeHigh','TownFixtureBlock','SchoolDeskBlock','SchoolDeskBlockEntity','TownCarry'):
                  assert f'io/github/knaitoe/theoldesthouse/labyrinth/{name}.class' in z.namelist()
              for name in ('wax_cylinder_1','wax_cylinder_2','wax_cylinder_3','family_film'):
                  song=json.loads(z.read(f'data/the_oldest_house/jukebox_song/{name}.json'))
                  assert song['length_in_seconds'] > 0
              hotel = json.loads(z.read('assets/the_oldest_house/blockstates/hotel_prop.json'))['variants']
              assert len(hotel) == 160
              for name in ('hotel_master_key','hotel_drink','hotel_photograph'):
                  mesh=json.loads(z.read(f'assets/the_oldest_house/models/item/{name}.json'))
                  assert len(mesh['elements']) >= 2 and 'display' in mesh
              for name in ('piano','orchestra','bell','hose'):
                  assert z.read(f'assets/the_oldest_house/sounds/hotel/{name}.ogg').startswith(b'OggS')
              for name in ('seance_planchette', 'wallpaper_folio'):
                  mesh = json.loads(z.read(f'assets/the_oldest_house/models/item/{name}.json'))
                  assert len(mesh['elements']) >= 6 and 'display' in mesh
              assert 'assets/the_oldest_house/blockstates/nursery_wallpaper.json' in z.namelist()
              from PIL import Image
              from io import BytesIO
              inventory = json.loads(pathlib.Path('art/inventory/assets_0430.json').read_text())['items']
              assert len(inventory) == 20
              for item in inventory:
                  name = item['item']
                  model = json.loads(z.read(f'assets/the_oldest_house/models/item/{name}.json'))
                  assert model['textures']['layer0'] == f'the_oldest_house:item/{name}'
                  icon = Image.open(BytesIO(z.read(f'assets/the_oldest_house/textures/item/{name}.png')))
                  icon.load()
                  expected_size = (16, 16) if name in ('church_key','archive_key','well_ribbon') else (32, 32)
                  assert icon.size == expected_size and icon.mode == 'RGBA', (name, icon.size, icon.mode)
              for name in ('plain_camera','archive_key','church_key','well_ribbon','franks_package'):
                  icon = Image.open(BytesIO(z.read(f'assets/the_oldest_house/textures/item/{name}.png')))
                  assert icon.size == (16, 16) and icon.mode == 'RGBA', name
              for name in ('HouseHuman', 'HollowayCamp', 'HollowayVignette', 'HarriganAppearance'):
                  assert f'io/github/knaitoe/theoldesthouse/labyrinth/{name}.class' in z.namelist()
              for name in ('holloway', 'harrigan', 'harrigan_dead', 'finale_witness', 'lake_witch', 'lake_witch_memory', 'caged_child'):
                  from PIL import Image
                  from io import BytesIO
                  skin = Image.open(BytesIO(z.read(f'assets/the_oldest_house/textures/entity/{name}.png')))
                  assert skin.size == (256, 256) and skin.mode == 'RGBA'
              static = Image.open(BytesIO(z.read('assets/the_oldest_house/textures/block/model_home_static.png')))
              assert static.size == (32, 384)
              assert json.loads(z.read('assets/the_oldest_house/textures/block/model_home_static.png.mcmeta'))['animation']['frametime'] == 2
              assert 'assets/the_oldest_house/sounds/vignette/heartbeat.ogg' in z.namelist()
              assert 'vignette.heartbeat' in json.loads(z.read('assets/the_oldest_house/sounds.json'))
              for name in ('assets/the_oldest_house/textures/entity/lake_witch.png',
                           'assets/the_oldest_house/models/item/church_key.json',
                           'data/the_oldest_house/recipe/dry_essay_one.json',
                           'data/the_oldest_house/recipe/dry_essay_two.json',
                           'data/the_oldest_house/recipe/dry_essay_three.json',
                           'assets/the_oldest_house/sounds/indian_lake/hymn.ogg',
                           'assets/the_oldest_house/sounds/indian_lake/witch.ogg',
                           'assets/the_oldest_house/sounds/indian_lake/door.ogg',
                           'assets/the_oldest_house/textures/entity/lake_witch_memory.png',
                           'assets/the_oldest_house/textures/entity/lake_boy.png',
                           'assets/the_oldest_house/models/item/shallows_burden.json',
                           'assets/the_oldest_house/sounds/indian_lake/cave_voice_0.ogg',
                           'assets/the_oldest_house/sounds/indian_lake/cave_voice_7.ogg',
                           'assets/the_oldest_house/sounds/indian_lake/cave_door.ogg',
                           'assets/the_oldest_house/sounds/indian_lake/shallows_door.ogg',
                           'assets/the_oldest_house/models/item/lake_phone.json',
                           'assets/the_oldest_house/sounds/indian_lake/phone_door.ogg',
                           'assets/the_oldest_house/sounds/indian_lake/phone_record.ogg',
                           'assets/the_oldest_house/sounds/indian_lake/phone_water.ogg',
                           'io/github/knaitoe/theoldesthouse/client/LakePhoneClient.class',
                           'io/github/knaitoe/theoldesthouse/labyrinth/PhoneCanoe.class',
                           'io/github/knaitoe/theoldesthouse/network/ClapCuePayload.class',
                           'io/github/knaitoe/theoldesthouse/client/ClapCueClient.class',
                           'io/github/knaitoe/theoldesthouse/client/CompanionWheel.class',
                           'io/github/knaitoe/theoldesthouse/labyrinth/LabyrinthDomestic.class',
                           'io/github/knaitoe/theoldesthouse/labyrinth/HarriganPhoneItem$Keepsake.class',
                           'io/github/knaitoe/theoldesthouse/gametest/HarriganDialogueTests.class',
                           'io/github/knaitoe/theoldesthouse/labyrinth/GoatmanVignette.class',
                           'io/github/knaitoe/theoldesthouse/client/GoatmanChildRenderer.class',
                           'io/github/knaitoe/theoldesthouse/client/GoatmanClient.class',
                           'io/github/knaitoe/theoldesthouse/gametest/GoatmanTests.class',
                           'assets/the_oldest_house/textures/entity/trailer_child_0.png',
                           'assets/the_oldest_house/textures/entity/trailer_child_5.png',
                           'assets/the_oldest_house/sounds/goatman/hammer.ogg',
                           'assets/the_oldest_house/sounds/goatman/laugh.ogg',
                           'assets/the_oldest_house/sounds/goatman/woods.ogg',
                           'assets/the_oldest_house/models/item/trailer_plate.json',
                           'assets/the_oldest_house/textures/item/trailer_plate.png' ):
                  assert name in z.namelist(), name
              # The owner-approved 0.4.65 artwork keeps each model's UV proportions and alpha mask.
              art = json.loads(pathlib.Path('art/inventory/cast_0465.json').read_text())
              assert len(art['approved_textures']) == 67 and art['entity_count'] == 61
              for record in art['approved_textures']:
                  name = record['path'].removeprefix('src/main/resources/')
                  raw = z.read(name)
                  assert hashlib.sha256(raw).hexdigest() == record['sha256'], name
                  image = Image.open(BytesIO(raw)).convert('RGBA')
                  assert list(image.size) == record['size'], name
                  assert hashlib.sha256(image.getchannel('A').tobytes()).hexdigest() == record['alpha_sha256'], name
              for name in ('TrailerFixtureBlock','TrailerDoorBlock','TrailerDoorBlockEntity','GoatmanStalking','GoatmanTrailerUpgrade'):
                  assert f'io/github/knaitoe/theoldesthouse/labyrinth/{name}.class' in z.namelist()
              for name in ('HumanoidMotion','TrailerDoorRenderer','TrailerVisualProof'):
                  assert f'io/github/knaitoe/theoldesthouse/client/{name}.class' in z.namelist()
              for name in ('toilet','sink_empty','sink_filled','bathroom_window_open','bathroom_window_closed'):
                  assert len(json.loads(z.read(f'assets/the_oldest_house/models/block/trailer/{name}.json'))['elements']) >= 5
              sounds = json.loads(z.read('assets/the_oldest_house/sounds.json'))
              assert all(f'goatman.{cue}' in sounds for cue in ('hammer', 'laugh', 'woods'))
              # Every cue is subtitled, so the game is playable without sound.
              english = json.loads(z.read('assets/the_oldest_house/lang/en_us.json'))
              unsubtitled = sorted(k for k, v in sounds.items() if v.get('subtitle') not in english)
              assert not unsubtitled, f'sound events without an English subtitle: {unsubtitled}'
              for name in ('io/github/knaitoe/theoldesthouse/house/HouseMarginalia.class',
                           'io/github/knaitoe/theoldesthouse/house/HouseCorrespondence.class',
                           'io/github/knaitoe/theoldesthouse/house/HouseCorrespondence$OriginalMenu.class',
                           'io/github/knaitoe/theoldesthouse/house/CorrespondenceTexts.class',
                           'io/github/knaitoe/theoldesthouse/gametest/CorrespondenceTests.class',
                           'data/the_oldest_house/correspondence/letters.json',
                           'data/the_oldest_house/correspondence/advances.json',
                           'io/github/knaitoe/theoldesthouse/house/HouseMarginalia$NotebookMenu.class',
                           'io/github/knaitoe/theoldesthouse/house/HouseholdFurnitureBlock.class',
                           'io/github/knaitoe/theoldesthouse/gametest/MarginaliaTests.class',
                           'io/github/knaitoe/theoldesthouse/labyrinth/CaverVignette.class',
                           'io/github/knaitoe/theoldesthouse/labyrinth/CaverCave.class',
                           'io/github/knaitoe/theoldesthouse/client/CaverCrawlClient.class',
                           'io/github/knaitoe/theoldesthouse/network/CaverCrawlPayload.class',
                           'io/github/knaitoe/theoldesthouse/gametest/CaverTests.class',
                           'assets/the_oldest_house/blockstates/household_furniture.json',
                           'assets/the_oldest_house/blockstates/note_surface.json',
                           'assets/the_oldest_house/font/claw.json',
                           'assets/the_oldest_house/textures/font/claw.png'):
                  assert name in z.namelist(), name
              for name in ('io/github/knaitoe/theoldesthouse/labyrinth/NovelVignettes.class',
                           'io/github/knaitoe/theoldesthouse/labyrinth/FinaleCollapse.class',
                           'io/github/knaitoe/theoldesthouse/client/NovelSceneClient.class',
                           'io/github/knaitoe/theoldesthouse/gametest/NovelTests.class',
                           'io/github/knaitoe/theoldesthouse/gametest/CollapseTests.class',
                           'assets/the_oldest_house/textures/block/cell_gouges.png',
                           'assets/the_oldest_house/textures/block/well_carvings.png',
                           'assets/the_oldest_house/blockstates/novel_prop.json',
                           'assets/the_oldest_house/models/item/walkie_talkie.json',
                           'assets/the_oldest_house/font/pelafina.json',
                           'assets/the_oldest_house/sounds/novel/collapse.ogg',
                           'io/github/knaitoe/theoldesthouse/labyrinth/ElkCarcassMap.class',
                           'io/github/knaitoe/theoldesthouse/labyrinth/ElkHunt.class',
                           'io/github/knaitoe/theoldesthouse/client/ElkVisualProof.class',
                           'assets/the_oldest_house/textures/entity/literary_killer.png',
                           'assets/the_oldest_house/textures/entity/literary_elk_carcass.png',
                           'assets/the_oldest_house/textures/entity/literary_crew_0.png',
                           'assets/the_oldest_house/textures/entity/literary_guest_0.png',
                           'assets/the_oldest_house/blockstates/yacht_rail.json',
                           'assets/the_oldest_house/models/block/yacht_porthole.json'):
                  assert name in z.namelist(), name
              for variant in json.loads(z.read('assets/the_oldest_house/blockstates/literary_prop.json'))['variants'].values():
                  model=json.loads(z.read('assets/the_oldest_house/models/'+variant['model'].split(':',1)[1]+'.json'))
                  for texture in model['textures'].values():
                      if texture.startswith('the_oldest_house:'):
                          assert z.read('assets/the_oldest_house/textures/'+texture.split(':',1)[1]+'.png').startswith(b'\x89PNG\r\n\x1a\n')
              assert len(json.loads(z.read('assets/the_oldest_house/blockstates/literary_prop.json'))['variants'])==384
              for variant in json.loads(z.read('assets/the_oldest_house/blockstates/novel_prop.json'))['variants'].values():
                  model=json.loads(z.read('assets/the_oldest_house/models/'+variant['model'].split(':',1)[1]+'.json'))
                  for texture in model['textures'].values():
                      if texture.startswith('the_oldest_house:'):
                          assert z.read('assets/the_oldest_house/textures/'+texture.split(':',1)[1]+'.png').startswith(b'\x89PNG\r\n\x1a\n')
              furniture=json.loads(z.read('assets/the_oldest_house/blockstates/household_furniture.json'))['variants']
              assert len(furniture)==56, 'four directions for all fourteen furniture kinds'
              for variant in furniture.values():
                  name=variant['model'].split(':',1)[1]
                  model=json.loads(z.read(f'assets/the_oldest_house/models/{name}.json'))
                  for texture in model['textures'].values():
                      if texture.startswith('the_oldest_house:'):
                          asset=texture.split(':',1)[1]
                          assert z.read(f'assets/the_oldest_house/textures/{asset}.png').startswith(b'\x89PNG\r\n\x1a\n')
                      else:
                          assert texture in ('minecraft:block/oak_planks','minecraft:block/stripped_dark_oak_log'), texture
          digest = hashlib.sha256(jar.read_bytes()).hexdigest()
          jar.with_suffix('.jar.sha256').write_text(f'{digest}  {jar.name}\n')
          print(f'Playable package: {jar.name}; SHA-256 {digest}')
          PY

      # Generates The Oldest House on a game-test server and checks its
      # architecture (sightline, enclosure, walkability, glazing). The log
      # also carries an OTH-DUMP block listing for offline rendering.
      - name: Structure game tests
        timeout-minutes: 42
        env:
          JAVA_TOOL_OPTIONS: -Xmx6g
        run: |
          mkdir -p run
          printf 'view-distance=3\nsimulation-distance=3\n' > run/server.properties
          python3 - <<'PY' &
          import pathlib, subprocess, time
          folder = pathlib.Path('build/gametest-diagnostics')
          folder.mkdir(parents=True, exist_ok=True)
          # JVM housekeeping threads; everything else is printed to the log so
          # a stalled game server can be read without downloading the artifact.
          quiet = ('GC Thread', 'G1 ', 'CompilerThread', 'VM Thread', 'VM Periodic', 'Signal Dispatcher',
                   'Finalizer', 'Reference Handler', 'Common-Cleaner', 'Notification Thread', 'Service Thread',
                   'Attach Listener', 'Monitor Deflation', 'JNI global', 'Heap', 'Timer hack thread')
          for elapsed in (90, 180):
              time.sleep(90)
              listing = subprocess.check_output(['jps', '-l'], text=True)
              (folder / f'processes-{elapsed}.txt').write_text(listing)
              for process in listing.splitlines():
                  if not any(name in process for name in ('BootstrapLauncher', 'devlaunch.Main', 'gametest.Main')):
                      continue
                  pid = process.split()[0]
                  dump = subprocess.run(['jstack', pid], capture_output=True, text=True, timeout=30).stdout
                  (folder / f'threads-{elapsed}-{pid}.txt').write_text(dump)
                  blocks = [b for b in dump.split('\n\n') if b.strip() and not any(q in b.split('\n')[0] for q in quiet)]
                  print(f'::group::Game server threads at {elapsed}s ({process})', flush=True)
                  print('\n\n'.join(blocks), flush=True)
                  print('::endgroup::', flush=True)
          PY
          diagnostic=$!
          trap 'kill "$diagnostic" 2>/dev/null || true' EXIT
          set -o pipefail
          timeout --signal=QUIT --kill-after=20s 40m gradle runGameTestServer --no-daemon -Dorg.gradle.jvmargs=-Xmx512m 2>&1 | tee build/native-gametest.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          log = Path('build/native-gametest.log').read_text()
          passed = re.findall(r'All (\d+) required tests passed', log)
          assert 'OutOfMemoryError' not in log, 'The native test server exhausted its heap; failed native chunk saves are not valid verification.'
          declared = sum(len(re.findall(r'@GameTest\s*\(', p.read_text())) for p in Path('src/main/java').rglob('*.java'))
          assert passed, 'The native server never completed its required tests; a successful process exit is insufficient.'
          assert int(passed[-1]) >= declared, f'Only {passed[-1]} native tests completed; {declared} are declared.'
          print(f'Native gameplay verified: {passed[-1]} completed tests, {declared} declared.')
          PY

      - name: Publish failed game tests
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          log = Path('build/native-gametest.log')
          if not log.exists():
              print('::error title=Failed game test::no game test log was written')
              raise SystemExit(0)
          lines = log.read_text(errors='replace').splitlines()
          keys = re.compile(r'(failed|FAILED|Exception|exception|Error|required tests|timed out|Caused by)')
          picked = []
          for i, line in enumerate(lines):
              if keys.search(line) and 'Node.js' not in line:
                  text = re.sub(r'^\[[^]]*\] \[[^]]*\] \[[^]]*\]: ', '', line).strip()
                  detail = ' | '.join(l.strip() for l in lines[i + 1:i + 3])
                  entry = (text + ' :: ' + detail)[:900]
                  if entry not in picked:
                      picked.append(entry)
          tail = ' | '.join(l.strip() for l in lines[-12:])[:3000]
          for entry in picked[:9]:
              print('::error title=Failed game test::' + entry.replace('%', '%25'))
          print('::error title=Game test log tail::' + tail.replace('%', '%25'))
          PY

      - name: Publish vignette audit
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          report = Path('build/vignette-audit.txt')
          if not report.exists():
              print('::warning title=Vignette audit::No audit report was written.')
              raise SystemExit(0)
          text = report.read_text()
          print(text)
          chunks, current = [], ''
          for line in text.splitlines(keepends=True):
              if len(current) + len(line) > 3800:
                  chunks.append(current); current = ''
              current += line
          if current: chunks.append(current)
          kinds = ['notice'] * 10 + ['warning'] * 10 + ['error'] * 10
          for i, chunk in enumerate(chunks[:30]):
              body = chunk.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print(f'::{kinds[i]} title=Vignette audit {i + 1}/{len(chunks)}::{body}')
          PY

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-diagnostics-${{ github.sha }}
          path: |
            build/gametest-diagnostics/
            build/native-gametest.log
            build/combat-proof/
          if-no-files-found: ignore

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: the-oldest-house-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/libs/*.jar.sha256
          if-no-files-found: error

