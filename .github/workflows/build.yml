name: Review package recovery

on:
  push:
    branches: [ci/review-artifact-2173933]

permissions:
  actions: read
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Download prior full native diagnostics
        uses: actions/download-artifact@v4
        with:
          name: gametest-diagnostics-f42fcbf2066bc8a395225e84f2944b631572356e
          run-id: 38501911907
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: diagnostics
      - name: Print bounded native failures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          log=Path('diagnostics/native-gametest.log').read_text()
          for line in log.splitlines():
              if any(key in line for key in ('failed at','required tests failed','GAME TESTS COMPLETE','All 612 required')):
                  print(line)
          PY
      - name: Download exact reviewed source package
        uses: actions/download-artifact@v4
        with:
          name: seam-candidate-7fe2dd580f247a64b1db0d4998b25bff508768e5
          run-id: 38509353701
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reviewed
      - name: Prepare valid mod archive entries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib,json
          jar=Path('reviewed/the_oldest_house-0.4.92.jar')
          expected=Path(str(jar)+'.sha256').read_text().split()[0]
          assert hashlib.sha256(jar.read_bytes()).hexdigest()==expected
          out=Path('mod-root');out.mkdir()
          with ZipFile(jar) as z:
              assert z.testzip() is None
              assert 'version="0.4.92"' in z.read('META-INF/neoforge.mods.toml').decode().replace(' ','')
              assert 'io/github/knaitoe/theoldesthouse/TheOldestHouse.class' in z.namelist()
              for info in z.infolist():
                  p=out/info.filename
                  assert p.resolve().is_relative_to(out.resolve())
                  if info.is_dir():p.mkdir(parents=True,exist_ok=True)
                  else:
                      p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(z.read(info))
              assert all((out/n).read_bytes()==z.read(n) for n in z.namelist() if not n.endswith('/'))
              for n in z.namelist():
                  if n.endswith('.json'):json.loads(z.read(n))
              print('All',len(z.infolist()),'original mod entries are byte-identical; archive CRC, native descriptor and JSON passed.')
              print('Verified source: 7fe2dd580f247a64b1db0d4998b25bff508768e5; original JAR SHA256:',expected)
          PY
      - name: Upload native mod archive root
        uses: actions/upload-artifact@v4
        with:
          name: native-mod-root-7fe2dd5
          path: mod-root/
          include-hidden-files: true
          compression-level: 6
          if-no-files-found: error
