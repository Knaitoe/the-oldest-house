name: Backseat host-stall diagnosis
on:
  push:
    branches: [diagnostics/backseat-stall-7a8c2b3]
permissions:
  contents: read
jobs:
  backseat:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Verify unchanged native proof and gameplay source
        run: |
          python3 - <<'CHECK'
          from pathlib import Path
          import ast,subprocess
          base='7a8c2b35e19b65c980f6a766c72670b9d21d633c'
          names=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          assert names=={'.github/workflows/build.yml','tools/run_live_expedition.py'},names
          old=subprocess.check_output(['git','show',base+':tools/run_live_expedition.py'],text=True)
          expected=old.replace('                and "phase 2" in native_log.read_text(errors="replace")\n','                and ("phase 2" in native_log.read_text(errors="replace")\n                     or backseat_only and "BACKSEAT SOCKET phase 1" in native_log.read_text(errors="replace"))\n')
          assert Path('tools/run_live_expedition.py').read_text()==expected
          ast.parse(expected)
          CHECK
      - name: Native graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libasound2t64 libpulse0 ffmpeg
      - name: Two actual Backseat clients with unchanged route and deadlines
        timeout-minutes: 13
        run: |
          LP_NUM_THREADS=1 LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a python3 tools/run_live_expedition.py --backseat-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backseat-host-stall-diagnosis
          path: |
            build/backseat-live-proof/
            run-backseat-live/*/logs/latest.log
            run-backseat-live/*/crash-reports/
          if-no-files-found: warn
