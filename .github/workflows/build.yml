name: Native character art review
on:
  push:
    branches:
      - work/character-art-paint-0.4.100
jobs:
  native-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - run: |
          python3 -m pip install Pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
      - name: Render every human and creature on the production model layers
        env:
          JAVA_TOOL_OPTIONS: -Xmx4g
        run: |
          python3 tools/paint_character_skins.py --check
          python3 tools/verify_character_art.py
          ALSOFT_DRIVERS=null LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a timeout --signal=QUIT --kill-after=15s 9m gradle runClient -PcharacterArtSmoke --no-daemon -Dorg.gradle.jvmargs=-Xmx512m
          test -s build/font-smoke/character-art-passed.txt
          for view in $(seq -w 0 19); do test -s build/font-smoke/native-character-art-$view.png; done
      - name: Publish actual native views
        if: always()
        run: |
          python3 - <<'PY'
          import base64, io
          from pathlib import Path
          from PIL import Image
          for path in sorted(Path('build/font-smoke').glob('native-character-art-*.png')):
              image=Image.open(path).convert('RGB')
              image.thumbnail((1100,800))
              buffer=io.BytesIO()
              image.save(buffer,format='JPEG',quality=90)
              data=base64.b64encode(buffer.getvalue()).decode()
              print(f'VIEW-BEGIN {path.stem} {image.width}x{image.height} {len(data)}')
              for i in range(0,len(data),4000):print('VIEW-DATA '+data[i:i+4000])
              print('VIEW-END '+path.stem)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-character-art-117-sheets
          path: |
            build/font-smoke/native-character-art-*.png
            build/font-smoke/character-art-passed.txt
          if-no-files-found: error
