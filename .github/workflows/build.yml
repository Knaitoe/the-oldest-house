name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build
        id: build_mod
        run: gradle build

      - name: Verify writing atlas structure
        run: |
          python3 -m pip install Pillow
          python3 tools/verify_writing_fonts.py
          python3 tools/verify_textures.py

      - name: Verify playable package
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          jars = list(pathlib.Path('build/libs').glob('the_oldest_house-*.jar'))
          runtime = [p for p in jars if not p.stem.endswith(('-sources', '-javadoc'))]
          assert len(runtime) == 1, runtime
          jar = runtime[0]
          with zipfile.ZipFile(jar) as z:
              for name in z.namelist():
                  if name.endswith('.json'):
                      json.loads(z.read(name))
              for name in ('assets/the_oldest_house/blockstates/chalk_mark.json',
                           'assets/the_oldest_house/blockstates/trail_line.json',
                           'assets/the_oldest_house/models/item/chalk.json',
                           'assets/the_oldest_house/models/item/trail_spool.json',
                           'data/the_oldest_house/recipe/chalk.json',
                           'data/the_oldest_house/recipe/trail_spool.json',
                           'assets/the_oldest_house/textures/entity/finale_materials.png',
                           'data/the_oldest_house/loot_modifiers/finale_notes.json'):
                  assert name in z.namelist(), name
              assert 'version="0.4.39"' in z.read('META-INF/neoforge.mods.toml').decode().replace(' ', '')
              assert 'io/github/knaitoe/theoldesthouse/gametest/SeamDoorTests.class' in z.namelist()
              correspondence = json.loads(z.read('data/the_oldest_house/correspondence/letters.json'))
              assert len(correspondence) == 108 and len({n['id'] for n in correspondence}) == 108
              assert 'io/github/knaitoe/theoldesthouse/gametest/CollectedCorrespondenceTests.class' in z.namelist()
              for name in ('ClassicsVignettes', 'ClassicsRooms', 'ClassicsRegistry', 'ClassicsTexts', 'SeanceActor', 'WallpaperPanelBlock'):
                  assert f'io/github/knaitoe/theoldesthouse/labyrinth/{name}.class' in z.namelist()
              assert 'io/github/knaitoe/theoldesthouse/gametest/ClassicsTests.class' in z.namelist()
              for name in ('HotelVignette','HotelRooms','HotelRegistry','HotelTexts','HotelActor','HotelHose','HotelPropBlock','BlindStretch'):
                  assert f'io/github/knaitoe/theoldesthouse/labyrinth/{name}.class' in z.namelist()
              assert 'io/github/knaitoe/theoldesthouse/gametest/HotelTests.class' in z.namelist()
              for name in ('LiteraryVignettes','LiteraryRooms','LiteraryRegistry','LiteraryTexts','LiteraryActor','LiteraryElk','LiteraryCopies','LiteraryCabinChoices','LiteraryFrozenBlock','LiteraryModelBlockEntity'):
                  assert f'io/github/knaitoe/theoldesthouse/labyrinth/{name}.class' in z.namelist()
              for name in ('LiteraryTests',):
                  assert f'io/github/knaitoe/theoldesthouse/gametest/{name}.class' in z.namelist()
              assert 'io/github/knaitoe/theoldesthouse/client/LiteraryEffectsVisualProof.class' in z.namelist()
              literary = json.loads(z.read('assets/the_oldest_house/blockstates/literary_prop.json'))['variants']
              assert len(literary) == 288
              for name in ('elk_tooth','wheel_house_key','father_knife','grasshopper_jar','literary_photograph','family_film','father_meal','family_stew','wax_cylinder_one','wax_cylinder_two','wax_cylinder_three'):
                  mesh=json.loads(z.read(f'assets/the_oldest_house/models/item/{name}.json'))
                  assert len(mesh['elements']) >= 2 and 'display' in mesh
              for name in ('cylinder_one','cylinder_two','cylinder_three','family_film','party','blizzard','drip','giggle','scratch','hooves'):
                  assert z.read(f'assets/the_oldest_house/sounds/literary/{name}.ogg').startswith(b'OggS')
              for name in ('wax_cylinder_1','wax_cylinder_2','wax_cylinder_3','family_film'):
                  song=json.loads(z.read(f'data/the_oldest_house/jukebox_song/{name}.json'))
                  assert song['length_in_seconds'] > 0
              hotel = json.loads(z.read('assets/the_oldest_house/blockstates/hotel_prop.json'))['variants']
              assert len(hotel) == 160
              for name in ('hotel_master_key','hotel_drink','hotel_photograph'):
                  mesh=json.loads(z.read(f'assets/the_oldest_house/models/item/{name}.json'))
                  assert len(mesh['elements']) >= 2 and 'display' in mesh
              for name in ('piano','orchestra','bell','hose'):
                  assert z.read(f'assets/the_oldest_house/sounds/hotel/{name}.ogg').startswith(b'OggS')
              for name in ('seance_planchette', 'wallpaper_folio'):
                  mesh = json.loads(z.read(f'assets/the_oldest_house/models/item/{name}.json'))
                  assert len(mesh['elements']) >= 6 and 'display' in mesh
              assert 'assets/the_oldest_house/blockstates/nursery_wallpaper.json' in z.namelist()
              from PIL import Image
              from io import BytesIO
              inventory = json.loads(pathlib.Path('art/inventory/assets_0430.json').read_text())['items']
              assert len(inventory) == 20
              for item in inventory:
                  name = item['item']
                  model = json.loads(z.read(f'assets/the_oldest_house/models/item/{name}.json'))
                  assert model['textures']['layer0'] == f'the_oldest_house:item/{name}'
                  icon = Image.open(BytesIO(z.read(f'assets/the_oldest_house/textures/item/{name}.png')))
                  icon.load()
                  assert icon.size == (32, 32) and icon.mode == 'RGBA'
              for name in ('HouseHuman', 'HollowayCamp', 'HollowayVignette', 'HarriganAppearance'):
                  assert f'io/github/knaitoe/theoldesthouse/labyrinth/{name}.class' in z.namelist()
              for name in ('holloway', 'harrigan', 'harrigan_dead', 'finale_witness', 'lake_witch', 'lake_witch_memory', 'caged_child'):
                  from PIL import Image
                  from io import BytesIO
                  skin = Image.open(BytesIO(z.read(f'assets/the_oldest_house/textures/entity/{name}.png')))
                  assert skin.size == (64, 64) and skin.mode == 'RGBA'
              static = Image.open(BytesIO(z.read('assets/the_oldest_house/textures/block/model_home_static.png')))
              assert static.size == (32, 384)
              assert json.loads(z.read('assets/the_oldest_house/textures/block/model_home_static.png.mcmeta'))['animation']['frametime'] == 2
              assert 'assets/the_oldest_house/sounds/vignette/heartbeat.ogg' in z.namelist()
              assert 'vignette.heartbeat' in json.loads(z.read('assets/the_oldest_house/sounds.json'))
              for name in ('assets/the_oldest_house/textures/entity/lake_witch.png',
                           'assets/the_oldest_house/models/item/church_key.json',
                           'data/the_oldest_house/recipe/dry_essay_one.json',
                           'data/the_oldest_house/recipe/dry_essay_two.json',
                           'data/the_oldest_house/recipe/dry_essay_three.json',
                           'assets/the_oldest_house/sounds/indian_lake/hymn.ogg',
                           'assets/the_oldest_house/sounds/indian_lake/witch.ogg',
                           'assets/the_oldest_house/sounds/indian_lake/door.ogg',
                           'assets/the_oldest_house/textures/entity/lake_witch_memory.png',
                           'assets/the_oldest_house/textures/entity/lake_boy.png',
                           'assets/the_oldest_house/models/item/shallows_burden.json',
                           'assets/the_oldest_house/sounds/indian_lake/cave_voice_0.ogg',
                           'assets/the_oldest_house/sounds/indian_lake/cave_voice_7.ogg',
                           'assets/the_oldest_house/sounds/indian_lake/cave_door.ogg',
                           'assets/the_oldest_house/sounds/indian_lake/shallows_door.ogg',
                           'assets/the_oldest_house/models/item/lake_phone.json',
                           'assets/the_oldest_house/sounds/indian_lake/phone_door.ogg',
                           'assets/the_oldest_house/sounds/indian_lake/phone_record.ogg',
                           'assets/the_oldest_house/sounds/indian_lake/phone_water.ogg',
                           'io/github/knaitoe/theoldesthouse/client/LakePhoneClient.class',
                           'io/github/knaitoe/theoldesthouse/labyrinth/PhoneCanoe.class',
                           'io/github/knaitoe/theoldesthouse/network/ClapCuePayload.class',
                           'io/github/knaitoe/theoldesthouse/client/ClapCueClient.class',
                           'io/github/knaitoe/theoldesthouse/client/CompanionWheel.class',
                           'io/github/knaitoe/theoldesthouse/labyrinth/LabyrinthDomestic.class',
                           'io/github/knaitoe/theoldesthouse/labyrinth/HarriganPhoneItem$Keepsake.class',
                           'io/github/knaitoe/theoldesthouse/gametest/HarriganDialogueTests.class',
                           'io/github/knaitoe/theoldesthouse/labyrinth/GoatmanVignette.class',
                           'io/github/knaitoe/theoldesthouse/client/GoatmanChildRenderer.class',
                           'io/github/knaitoe/theoldesthouse/client/GoatmanClient.class',
                           'io/github/knaitoe/theoldesthouse/gametest/GoatmanTests.class',
                           'assets/the_oldest_house/textures/entity/trailer_child_0.png',
                           'assets/the_oldest_house/textures/entity/trailer_child_5.png',
                           'assets/the_oldest_house/sounds/goatman/hammer.ogg',
                           'assets/the_oldest_house/sounds/goatman/laugh.ogg',
                           'assets/the_oldest_house/sounds/goatman/woods.ogg',
                           'assets/the_oldest_house/models/item/trailer_plate.json',
                           'assets/the_oldest_house/textures/item/trailer_plate.png' ):
                  assert name in z.namelist(), name
              for i in range(6):
                  assert f'assets/the_oldest_house/textures/entity/trailer_child_{i}.png' in z.namelist()
              sounds = json.loads(z.read('assets/the_oldest_house/sounds.json'))
              assert all(f'goatman.{cue}' in sounds for cue in ('hammer', 'laugh', 'woods'))
              for name in ('io/github/knaitoe/theoldesthouse/house/HouseMarginalia.class',
                           'io/github/knaitoe/theoldesthouse/house/HouseCorrespondence.class',
                           'io/github/knaitoe/theoldesthouse/house/HouseCorrespondence$OriginalMenu.class',
                           'io/github/knaitoe/theoldesthouse/house/CorrespondenceTexts.class',
                           'io/github/knaitoe/theoldesthouse/gametest/CorrespondenceTests.class',
                           'data/the_oldest_house/correspondence/letters.json',
                           'data/the_oldest_house/correspondence/advances.json',
                           'io/github/knaitoe/theoldesthouse/house/HouseMarginalia$NotebookMenu.class',
                           'io/github/knaitoe/theoldesthouse/house/HouseholdFurnitureBlock.class',
                           'io/github/knaitoe/theoldesthouse/gametest/MarginaliaTests.class',
                           'io/github/knaitoe/theoldesthouse/labyrinth/CaverVignette.class',
                           'io/github/knaitoe/theoldesthouse/labyrinth/CaverCave.class',
                           'io/github/knaitoe/theoldesthouse/client/CaverCrawlClient.class',
                           'io/github/knaitoe/theoldesthouse/network/CaverCrawlPayload.class',
                           'io/github/knaitoe/theoldesthouse/gametest/CaverTests.class',
                           'assets/the_oldest_house/blockstates/household_furniture.json',
                           'assets/the_oldest_house/blockstates/note_surface.json',
                           'assets/the_oldest_house/font/claw.json',
                           'assets/the_oldest_house/textures/font/claw.png'):
                  assert name in z.namelist(), name
              for name in ('io/github/knaitoe/theoldesthouse/labyrinth/NovelVignettes.class',
                           'io/github/knaitoe/theoldesthouse/labyrinth/FinaleCollapse.class',
                           'io/github/knaitoe/theoldesthouse/client/NovelSceneClient.class',
                           'io/github/knaitoe/theoldesthouse/gametest/NovelTests.class',
                           'io/github/knaitoe/theoldesthouse/gametest/CollapseTests.class',
                           'assets/the_oldest_house/textures/block/cell_gouges.png',
                           'assets/the_oldest_house/textures/block/well_carvings.png',
                           'assets/the_oldest_house/blockstates/novel_prop.json',
                           'assets/the_oldest_house/models/item/walkie_talkie.json',
                           'assets/the_oldest_house/font/pelafina.json',
                           'assets/the_oldest_house/sounds/novel/collapse.ogg'):
                  assert name in z.namelist(), name
              for variant in json.loads(z.read('assets/the_oldest_house/blockstates/novel_prop.json'))['variants'].values():
                  model=json.loads(z.read('assets/the_oldest_house/models/'+variant['model'].split(':',1)[1]+'.json'))
                  for texture in model['textures'].values():
                      if texture.startswith('the_oldest_house:'):
                          assert z.read('assets/the_oldest_house/textures/'+texture.split(':',1)[1]+'.png').startswith(b'\x89PNG\r\n\x1a\n')
              furniture=json.loads(z.read('assets/the_oldest_house/blockstates/household_furniture.json'))['variants']
              assert len(furniture)==48
              for variant in furniture.values():
                  name=variant['model'].split(':',1)[1]
                  model=json.loads(z.read(f'assets/the_oldest_house/models/{name}.json'))
                  for texture in model['textures'].values():
                      asset=texture.split(':',1)[1]
                      assert z.read(f'assets/the_oldest_house/textures/{asset}.png').startswith(b'\x89PNG\r\n\x1a\n')
          digest = hashlib.sha256(jar.read_bytes()).hexdigest()
          jar.with_suffix('.jar.sha256').write_text(f'{digest}  {jar.name}\n')
          print(f'Playable package: {jar.name}; SHA-256 {digest}')
          PY

      # Generates The Oldest House on a game-test server and checks its
      # architecture (sightline, enclosure, walkability, glazing). The log
      # also carries an OTH-DUMP block listing for offline rendering.
      - name: Structure game tests
        timeout-minutes: 31
        env:
          JAVA_TOOL_OPTIONS: -Xmx4g
        run: |
          mkdir -p run
          printf 'view-distance=3\nsimulation-distance=3\n' > run/server.properties
          python3 - <<'PY' &
          import pathlib, subprocess, time
          folder = pathlib.Path('build/gametest-diagnostics')
          folder.mkdir(parents=True, exist_ok=True)
          # JVM housekeeping threads; everything else is printed to the log so
          # a stalled game server can be read without downloading the artifact.
          quiet = ('GC Thread', 'G1 ', 'CompilerThread', 'VM Thread', 'VM Periodic', 'Signal Dispatcher',
                   'Finalizer', 'Reference Handler', 'Common-Cleaner', 'Notification Thread', 'Service Thread',
                   'Attach Listener', 'Monitor Deflation', 'JNI global', 'Heap', 'Timer hack thread')
          for elapsed in (90, 180):
              time.sleep(90)
              listing = subprocess.check_output(['jps', '-l'], text=True)
              (folder / f'processes-{elapsed}.txt').write_text(listing)
              for process in listing.splitlines():
                  if not any(name in process for name in ('BootstrapLauncher', 'devlaunch.Main', 'gametest.Main')):
                      continue
                  pid = process.split()[0]
                  dump = subprocess.run(['jstack', pid], capture_output=True, text=True, timeout=30).stdout
                  (folder / f'threads-{elapsed}-{pid}.txt').write_text(dump)
                  blocks = [b for b in dump.split('\n\n') if b.strip() and not any(q in b.split('\n')[0] for q in quiet)]
                  print(f'::group::Game server threads at {elapsed}s ({process})', flush=True)
                  print('\n\n'.join(blocks), flush=True)
                  print('::endgroup::', flush=True)
          PY
          diagnostic=$!
          trap 'kill "$diagnostic" 2>/dev/null || true' EXIT
          set -o pipefail
          timeout --signal=QUIT --kill-after=20s 30m gradle runGameTestServer --no-daemon 2>&1 | tee build/native-gametest.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          log = Path('build/native-gametest.log').read_text()
          passed = re.findall(r'All (\d+) required tests passed', log)
          declared = sum(len(re.findall(r'@GameTest\s*\(', p.read_text())) for p in Path('src/main/java').rglob('*.java'))
          assert passed, 'The native server never completed its required tests; a successful process exit is insufficient.'
          assert int(passed[-1]) >= declared, f'Only {passed[-1]} native tests completed; {declared} are declared.'
          print(f'Native gameplay verified: {passed[-1]} completed tests, {declared} declared.')
          PY

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-diagnostics-${{ github.sha }}
          path: |
            build/gametest-diagnostics/
            build/native-gametest.log
            build/combat-proof/
          if-no-files-found: ignore

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: the-oldest-house-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/libs/*.jar.sha256
          if-no-files-found: error

      - name: Check native client font rendering
        if: ${{ !cancelled() && steps.build_mod.outcome == 'success' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a timeout --signal=QUIT --kill-after=15s 5m gradle runClient -PfontSmoke --no-daemon
          test -s build/font-smoke/passed.txt
          test -s build/font-smoke/native-writing.png
          test -s build/font-smoke/npcs-passed.txt
          test -s build/font-smoke/native-npcs.png
          test -s build/font-smoke/cast-passed.txt
          test -s build/font-smoke/home-design-passed.txt
          test -s build/font-smoke/native-home-design.png
          test -s build/font-smoke/minotaur-render-passed.txt
          test -s build/font-smoke/native-minotaur.png
          test -s build/font-smoke/inventory-passed.txt
          test -s build/font-smoke/native-inventory.png
          test -s build/font-smoke/companions-passed.txt
          test -s build/font-smoke/native-companions.png
          test -s build/font-smoke/hotel-passed.txt
          test -s build/font-smoke/native-hotel.png
          test -s build/font-smoke/literary-passed.txt
          test -s build/font-smoke/native-literary.png
          test -s build/font-smoke/literary-effects-passed.txt
          test -s build/font-smoke/native-literary-effects.png
          test -s build/font-smoke/classics-passed.txt
          test -s build/font-smoke/native-classics.png
          test -s build/font-smoke/native-cast.png
          test -s build/font-smoke/architecture-passed.txt
          test -s build/architecture-proof/manifest.txt
          test -s build/font-smoke/sky-passed.txt
          test -s build/font-smoke/native-sky-2.png

      - name: Upload native writing proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: writing-proof-${{ github.sha }}
          path: |
            build/font-smoke/
            run/logs/latest.log
          if-no-files-found: ignore

  hotel-gameplay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Focused native hotel gameplay
        timeout-minutes: 13
        env:
          JAVA_TOOL_OPTIONS: -Xmx4g
        run: |
          mkdir -p build run
          printf 'view-distance=3\nsimulation-distance=3\n' > run/server.properties
          set -o pipefail
          timeout --signal=QUIT --kill-after=20s 12m gradle runGameTestServer -PgameTestNamespaces=the_oldest_house_hotel --no-daemon 2>&1 | tee build/hotel-native.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          completed=re.findall(r'All (\d+) required tests passed',Path('build/hotel-native.log').read_text())
          declared=len(re.findall(r'@GameTest\s*\(',Path('src/main/java/io/github/knaitoe/theoldesthouse/gametest/HotelTests.java').read_text()))
          assert completed and int(completed[-1])==declared, (completed,declared)
          print(f'All {declared} native hotel gameplay cases passed; the full suite remains independently required.')
          PY
      - name: Upload focused hotel diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotel-diagnostics-${{ github.sha }}
          path: build/hotel-native.log

