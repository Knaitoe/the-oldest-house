name: Isolated Harrigan preservation proof
on:
  push:
    branches: [ci/harrigan-props-7fe2dd5]
permissions:
  contents: read
jobs:
  preservation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Verify original native props and seat preservation
        run: |
          set -o pipefail
          gradle runGameTestServer -PgameTestNamespaces=the_oldest_house_harrigan_review --no-daemon -Dorg.gradle.jvmargs=-Xmx512m 2>&1 | tee native-preservation.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('native-preservation.log').read_text()
          counts=re.findall(r'All (\d+) required tests passed',text)
          assert counts and int(counts[-1])==4, 'The full isolated native corpus must actually execute and pass.'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-harrigan-preservation-7fe2dd5
          path: native-preservation.log
