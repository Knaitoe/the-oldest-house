name: Backseat passing scenery candidate
on:
  push:
    branches: [feature/backseat-passing-environment]
permissions:
  contents: read
jobs:
  backseat:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Verify bounded source, all original assertions and deadlines
        run: |
          mkdir -p build
          python3 - <<'CHECK'
          from pathlib import Path
          import ast,hashlib,json,re,subprocess
          base='7a8c2b35e19b65c980f6a766c72670b9d21d633c'
          hashes={'src/main/java/io/github/knaitoe/theoldesthouse/client/BackseatSocketClient.java': '43e8654f61e68f252c92f7aac1abcb34b9a021d11eba7b80d7ebbc3743562ed4', 'src/main/java/io/github/knaitoe/theoldesthouse/gametest/BackseatCarTests.java': '1800bb95bb4a57354d2f7a27975fa9ca837e980a1433028d9c02287a0a9affba', 'src/main/java/io/github/knaitoe/theoldesthouse/labyrinth/BackseatRooms.java': '63fdd439a82e69dc19317d82212a0cc9a7e56a83fe2e3378be46b89d0a98de35', 'tools/run_live_expedition.py': '1a024badba5dd78f4100af5caff84a2fde631e4de0b3807c0976c7cdfc294aaa', 'gradle.properties': '32a53edd2d6873027f7e12b0716f05afab320be7edf4aa4274fe9a13274bf65e'}
          for path,sha in hashes.items():assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==sha,path
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          allowed=set(hashes)|{'AGENTS.md','README.md','docs/BACKSEAT_SCENERY_0_4_141.md','.github/workflows/build.yml'}
          assert changed==allowed,(changed,allowed)
          p='src/main/java/io/github/knaitoe/theoldesthouse/gametest/BackseatCarTests.java'
          old=subprocess.check_output(['git','show',base+':'+p],text=True);new=Path(p).read_text()
          assert re.findall(r'@GameTest\([^\n]*\)',old)==re.findall(r'@GameTest\([^\n]*\)',new)
          assert all(line in new for line in old.splitlines() if 'h.assertTrue(' in line)
          ast.parse(Path('tools/run_live_expedition.py').read_text())
          Path('build/backseat-candidate-source.json').write_text(json.dumps({'base':base,'candidate':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'source_sha256':hashes},indent=2))
          CHECK
      - name: Original native car controls, custody, physical crash and the dressed private roads
        timeout-minutes: 8
        run: |
          set -o pipefail
          timeout --signal=QUIT --kill-after=20s 7m gradle runGameTestServer -PgameTestNamespaces=the_oldest_house_backseat -PgameTestHeap=3g --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx768m 2>&1 | tee build/backseat-native.log
          python3 - <<'CHECK'
          from pathlib import Path
          log=Path('build/backseat-native.log').read_text()
          assert 'All 5 required tests passed' in log
          assert 'Game test server shutting down' in log
          CHECK
      - name: Native graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libasound2t64 libpulse0 ffmpeg
      - name: Actual exported road geometry and native materials
        timeout-minutes: 5
        run: |
          ALSOFT_DRIVERS=null LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a timeout --signal=QUIT --kill-after=15s 4m gradle runClient -PbackseatRoadSmoke --no-daemon
          test -s build/backseat-road/passed.txt
      - name: Both real drivers, native window motion, reconnect, mirrors and independent crashes
        timeout-minutes: 13
        run: |
          LP_NUM_THREADS=1 LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a python3 tools/run_live_expedition.py --backseat-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backseat-passing-scenery
          path: |
            build/backseat-native.log
            build/backseat-road/
            build/backseat-candidate-source.json
            build/backseat-live-proof/
            run-backseat-live/*/logs/latest.log
            run-backseat-live/*/crash-reports/
            run/logs/latest.log
          if-no-files-found: warn
