name: Six private personality scene touches
on:
  push:
    branches: [feature/six-personal-scene-touches]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile the consumers and run native strength, original-card, private-dialogue and owner-display cases
        run: |
          set -o pipefail
          mkdir -p build
          timeout --signal=QUIT --kill-after=20s 8m gradle build runGameTestServer -PgameTestNamespaces=the_oldest_house_tailoring -PgameTestHeap=3g --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx768m 2>&1 | tee build/tailoring-native.log
          python3 - <<'CHECK'
          from pathlib import Path
          log=Path('build/tailoring-native.log').read_text()
          assert 'All 4 required tests passed' in log
          assert 'Game test server shutting down' in log
          CHECK
      - name: Native graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libasound2t64 libpulse0
      - name: Two actual clients, one shared counter, original B reconnect and native card pages
        timeout-minutes: 13
        run: LP_NUM_THREADS=1 LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a python3 tools/run_tailoring_socket.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: six-tailoring-native
          path: |
            build/tailoring-live-proof/
            run-tailoring-live/*/logs/latest.log
            run-tailoring-live/*/crash-reports/
            build/tailoring-native.log
            build/libs/*.jar
            run/logs/latest.log
          if-no-files-found: warn
