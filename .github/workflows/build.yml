name: Goatman late-knock diagnosis

on:
  push:
    branches: [diagnostics/goatman-late-knock-39df986]

permissions:
  contents: read

jobs:
  late-knock:
    name: Native late-knock sample ${{ matrix.sample }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
    env:
      JAVA_TOOL_OPTIONS: -Dthe_oldest_house.traceLateKnock=true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Verify original source and assertions
        run: |
          mkdir -p build
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          base='39df9862a98f19e74463dee25435b3b87c1478af'
          traced={
              'src/main/java/io/github/knaitoe/theoldesthouse/labyrinth/GoatmanStalking.java',
              'src/main/java/io/github/knaitoe/theoldesthouse/gametest/GoatmanExteriorTests.java',
          }
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          assert changed == traced | {'.github/workflows/build.yml'}, changed
          for name in traced:
              original=subprocess.check_output(['git','show',base+':'+name],text=True)
              actual=Path(name).read_text()
              stripped=re.sub(r'^ *// LATE_TRACE_BEGIN\n.*?^ *// LATE_TRACE_END\n','',actual,flags=re.M|re.S)
              assert stripped == original, 'Only gated read/log blocks may differ: '+name
          Path('build/source-provenance.txt').write_text('Original code/assertions: '+base+'\nDiagnostic commit: '+subprocess.check_output(['git','rev-parse','HEAD'],text=True)+'All original conditions, timing, native deadlines and assertions retained.\n')
          PY
      - name: Run original complete-night assertion
        run: |
          set -o pipefail
          timeout --signal=QUIT --kill-after=20s 10m gradle runGameTestServer -PgameTestNamespaces=the_oldest_house_selected '-PgameTestMethods=GoatmanExteriorTests#theFinishedCamperKeepsItsOriginalMovingFromEveningThroughDawnWithSimultaneousDoorPressure' -PgameTestDirectory=run-late-knock -PgameTestHeap=3g --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx768m 2>&1 | tee build/native-late-knock.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          log=Path('build/native-late-knock.log').read_text()
          completed=re.findall(r'(\d+) GAME TESTS COMPLETE',log)
          assert completed and int(completed[-1])==1, 'The selected original native case must finish.'
          assert 'All 1 required tests passed' in log
          assert 'Game test server shutting down' in log
          assert 'LATE KNOCK EVENT' in log and 'LATE KNOCK OBSERVATION' in log
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: late-knock-sample-${{ matrix.sample }}
          path: |
            build/native-late-knock.log
            build/source-provenance.txt
            run-late-knock/logs/latest.log
            run-late-knock/crash-reports/
          if-no-files-found: warn
