name: Witch retreat before repair

on:
  push:
  workflow_dispatch:

jobs:
  multiplayer-story:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 9.2.1
    - name: Native multiplayer and personal staircase story
      timeout-minutes: 15
      env:
        JAVA_TOOL_OPTIONS: -Xmx4g
      run: 'mkdir -p build run

        printf ''view-distance=3\nsimulation-distance=3\n'' > run/server.properties

        set -o pipefail

        timeout --signal=QUIT --kill-after=20s 14m gradle runGameTestServer -PgameTestNamespaces=the_oldest_house_multiplayer --no-daemon -Dorg.gradle.jvmargs=-Xmx512m 2>&1 | tee build/multiplayer-native.log

        python3 - <<''PY''

        from pathlib import Path

        import re

        completed=re.findall(r''All (\d+) required tests passed'',Path(''build/multiplayer-native.log'').read_text())

        declared=sum(len(re.findall(r''@GameTest\s*\('',Path(''src/main/java/io/github/knaitoe/theoldesthouse/gametest/''+name).read_text())) for name in (''MultiplayerStoryTests.java'',''StaircaseLeakTests.java'',''PlaytestCommandTests.java'',''SceneSupportTests.java'',''SceneReviewTests.java'',''StaceyTests.java'',''SlasherTests.java'',''ReviewIntegrationTests.java''))

        assert completed and int(completed[-1])==declared, (completed,declared)

        print(f''All {declared} focused native multiplayer cases passed; the complete suite remains required.'')

        PY

        '
    - name: Upload multiplayer diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: multiplayer-diagnostics-${{ github.sha }}
        path: build/multiplayer-native.log
