name: Prepare cottage paintings
on:
  push:
    branches:
      - work/character-art-paint-0.4.100
jobs:
  paint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Paint and verify the five remaining human sheets
        run: |
          python - <<'PY'
          import base64, hashlib, json, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from paint_character_skins import LOOKS, OUT, paint
          from character_art_catalog import entries
          from PIL import Image
          manifest=Path('art/inventory/character_review_04100.json')
          review=json.loads(manifest.read_text())
          names=['walter','ruth','will','sergeant','messenger']
          changed=[]
          for short in names:
              name='literary_paw_'+short
              path=OUT/(name+'.png')
              key=path.relative_to(Path.cwd()).as_posix()
              before=hashlib.sha256(path.read_bytes()).hexdigest()
              assert review['unchanged_png_sha256'].pop(key)==before,key
              image=paint(LOOKS[name]);image.save(path,optimize=True)
              review['repainted'].append({'path':key,'previous_sha256':before,'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'size':list(image.size),'alpha_sha256':hashlib.sha256(image.getchannel('A').tobytes()).hexdigest()})
              changed.append(path)
          review['repainted'].sort(key=lambda row:row['path'])
          assert len(review['repainted'])==117 and len(review['unchanged_png_sha256'])==649
          manifest.write_text(json.dumps(review,indent=2)+'\n')
          changed.append(manifest)
          runtime=json.loads(Path('src/main/resources/assets/the_oldest_house/character_art.json').read_text())
          assert runtime==entries() and len(runtime)==109
          for path in changed:
              name=path.relative_to(Path.cwd()).as_posix() if path.is_absolute() else path.as_posix()
              encoded=base64.b64encode(path.read_bytes()).decode()
              print('ART-FILE-BEGIN '+name+' '+str(len(encoded)))
              for i in range(0,len(encoded),12000):print('ART-FILE-DATA '+encoded[i:i+12000])
              print('ART-FILE-END '+name)
          PY
          python tools/paint_character_skins.py --check
          python tools/verify_character_art.py
          python tools/verify_textures.py
