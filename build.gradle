plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
}

base {
    archivesName = mod_archive_name
}

tasks.named('jar', Jar) {
    manifest.attributes 'Implementation-Title': mod_name,
            'Implementation-Version': project.version
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def borrascaSocketSmoke = providers.gradleProperty('borrascaSocketSmoke').isPresent()
def uncannySocketSmoke = providers.gradleProperty('uncannySocketSmoke').isPresent()
def proofRoot = uncannySocketSmoke ? 'run-uncanny-live' : borrascaSocketSmoke ? 'run-borrasca-live' : 'run-live'
def proofReport = uncannySocketSmoke ? 'build/uncanny-live-proof' : borrascaSocketSmoke ? 'build/borrasca-live-proof' : 'build/live-proof'

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            if (providers.gradleProperty('fontSmoke').isPresent()) {
                systemProperty 'the_oldest_house.fontSmoke', 'true'
                programArguments.addAll '--width', '1200', '--height', '800'
            }
            if (providers.gradleProperty('characterArtSmoke').isPresent()) {
                systemProperty 'the_oldest_house.characterArtSmoke', 'true'
                programArguments.addAll '--width', '1200', '--height', '800'
            }
            if (providers.gradleProperty('ghostsSmoke').isPresent()) {
                systemProperty 'the_oldest_house.ghostsSmoke', 'true'
                programArguments.addAll '--width', '1200', '--height', '800'
            }
            if (providers.gradleProperty('interiorEnvironmentSmoke').isPresent()) {
                systemProperty 'the_oldest_house.interiorEnvironmentSmoke', 'true'
                programArguments.addAll '--width', '1200', '--height', '800'
            }
            if (providers.gradleProperty('vignetteReviewSmoke').isPresent()) {
                systemProperty 'the_oldest_house.vignetteReviewSmoke', 'true'
                programArguments.addAll '--width', '1200', '--height', '800'
            }
            if (providers.gradleProperty('windowEntrySmoke').isPresent()) {
                systemProperty 'the_oldest_house.windowEntrySmoke', 'true'
                programArguments.addAll '--width', '1200', '--height', '800'
            }
            if (providers.gradleProperty('trailerSmoke').isPresent()) {
                systemProperty 'the_oldest_house.trailerSmoke', 'true'
                programArguments.addAll '--width', '1200', '--height', '800'
            }
            if (providers.gradleProperty('holyRabbitSmoke').isPresent()) {
                systemProperty 'the_oldest_house.holyRabbitSmoke', 'true'
                programArguments.addAll '--width', '1200', '--height', '800'
            }
            if (providers.gradleProperty('nightclubSmoke').isPresent()) {
                systemProperty 'the_oldest_house.nightclubSmoke', 'true'
                programArguments.addAll '--width', '1200', '--height', '800'
            }
            if (providers.gradleProperty('stanleySmoke').isPresent()) {
                systemProperty 'the_oldest_house.stanleySmoke', 'true'
                programArguments.addAll '--width', '1200', '--height', '800'
            }
            if (providers.gradleProperty('lakeHairSmoke').isPresent()) {
                systemProperty 'the_oldest_house.lakeHairSmoke', 'true'
                programArguments.addAll '--width', '1200', '--height', '800'
            }
            if (providers.gradleProperty('borrascaSmoke').isPresent()) {
                systemProperty 'the_oldest_house.borrascaSmoke', 'true'
                programArguments.addAll '--width', '1200', '--height', '800'
            }
            if (providers.gradleProperty('deathPortraitSmoke').isPresent()) {
                systemProperty 'the_oldest_house.deathPortraitSmoke', 'true'
                programArguments.addAll '--width', '1200', '--height', '800'
            }
            if (providers.gradleProperty('uncannyEnvironmentSmoke').isPresent()) {
                systemProperty 'the_oldest_house.uncannyEnvironmentSmoke', 'true'
                programArguments.addAll '--width', '1440', '--height', '1000'
            }
            if (providers.gradleProperty('uncannySmoke').isPresent()) {
                systemProperty 'the_oldest_house.uncannySmoke', 'true'
                programArguments.addAll '--width', '1440', '--height', '1000'
            }
            if (providers.gradleProperty('goatmanEyesSmoke').isPresent()) {
                systemProperty 'the_oldest_house.goatmanEyesSmoke', 'true'
                programArguments.addAll '--width', '1200', '--height', '800'
            }
            if (providers.gradleProperty('hotelFixSmoke').isPresent()) {
                systemProperty 'the_oldest_house.hotelFixSmoke', 'true'
                programArguments.addAll '--width', '1200', '--height', '800'
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        proofServer {
            server()
            gameDirectory = project.file("${proofRoot}/server")
            programArgument '--nogui'
            // Two rendered clients stay live while the host serializes complete scene chunks.
            // The 2-GiB host stalled in native chunk serialization during the first reconnect.
            // Keep the watchdog and every reconnect check; allow room for the complete fixtures.
            jvmArgument '-Xmx3g'
            systemProperty 'the_oldest_house.liveProof', 'true'
            systemProperty 'the_oldest_house.uncannySocketSmoke', uncannySocketSmoke.toString()
            systemProperty 'the_oldest_house.borrascaSocketSmoke', borrascaSocketSmoke.toString()
            systemProperty 'the_oldest_house.liveProofDir', project.file(proofReport).absolutePath
        }
        proofA {
            client()
            gameDirectory = project.file("${proofRoot}/a")
            jvmArgument '-Xmx1100m'
            systemProperty 'the_oldest_house.liveProof', 'true'
            systemProperty 'the_oldest_house.uncannySocketSmoke', uncannySocketSmoke.toString()
            systemProperty 'the_oldest_house.liveProofRole', 'A'
            // Each client extracts LWJGL's natives to its own folder; two clients starting together
            // in the shared temp folder can find a half-written library.
            systemProperty 'org.lwjgl.system.SharedLibraryExtractPath', project.file("${proofRoot}/natives-a").absolutePath
            systemProperty 'the_oldest_house.liveProofDir', project.file(proofReport).absolutePath
            programArguments.addAll '--username', 'OTHProofA', '--quickPlayMultiplayer', '127.0.0.1:25578', '--width', '960', '--height', '640'
        }
        proofB {
            client()
            gameDirectory = project.file("${proofRoot}/b")
            jvmArgument '-Xmx1100m'
            systemProperty 'the_oldest_house.liveProof', 'true'
            systemProperty 'the_oldest_house.uncannySocketSmoke', uncannySocketSmoke.toString()
            systemProperty 'the_oldest_house.liveProofRole', 'B'
            systemProperty 'org.lwjgl.system.SharedLibraryExtractPath', project.file("${proofRoot}/natives-b").absolutePath
            systemProperty 'the_oldest_house.liveProofDir', project.file(proofReport).absolutePath
            programArguments.addAll '--username', 'OTHProofB', '--quickPlayMultiplayer', '127.0.0.1:25578', '--width', '960', '--height', '640'
        }

        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file(providers.gradleProperty('gameTestDirectory').getOrElse('run'))
            // Full native fixtures and chunk serialization exhausted five GiB.
            // Retain every persistence check with a six-GiB test-host heap.
            jvmArgument '-Xmx6g'
            systemProperty 'neoforge.enabledGameTestNamespaces', providers.gradleProperty('gameTestNamespaces').getOrElse(project.mod_id + ',' + project.mod_id + '_architecture,' + project.mod_id + '_writing,' + project.mod_id + '_hotel,' + project.mod_id + '_literary,' + project.mod_id + '_fan488,' + project.mod_id + '_ghosts,' + project.mod_id + '_doors,' + project.mod_id + '_seam,' + project.mod_id + '_staircase,' + project.mod_id + '_multiplayer,' + project.mod_id + '_exploration,' + project.mod_id + '_caver,' + project.mod_id + '_goatman,' + project.mod_id + '_charge,' + project.mod_id + '_mirrorcheck,' + project.mod_id + '_playtest488,' + project.mod_id + '_playtest492,' + project.mod_id + '_nightclub,' + project.mod_id + '_wake,' + project.mod_id + '_nightward,' + project.mod_id + '_lake_house,' + project.mod_id + '_borrasca,' + project.mod_id + '_goatman_windows,' + project.mod_id + '_goatman_entry,' + project.mod_id + '_uncanny,' + project.mod_id + '_uncanny_environment,' + project.mod_id + '_interior_review')
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neo_version,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
