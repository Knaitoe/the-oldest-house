plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            if (providers.gradleProperty('fontSmoke').isPresent()) {
                systemProperty 'the_oldest_house.fontSmoke', 'true'
                programArguments.addAll '--width', '1200', '--height', '800'
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        proofServer {
            server()
            gameDirectory = project.file('run-live/server')
            programArgument '--nogui'
            jvmArgument '-Xmx1400m'
            systemProperty 'the_oldest_house.liveProof', 'true'
            systemProperty 'the_oldest_house.liveProofDir', project.file('build/live-proof').absolutePath
        }
        proofA {
            client()
            gameDirectory = project.file('run-live/a')
            jvmArgument '-Xmx1100m'
            systemProperty 'the_oldest_house.liveProof', 'true'
            systemProperty 'the_oldest_house.liveProofRole', 'A'
            // Each client extracts LWJGL's natives to its own folder; two clients starting together
            // in the shared temp folder can find a half-written library.
            systemProperty 'org.lwjgl.system.SharedLibraryExtractPath', project.file('run-live/natives-a').absolutePath
            systemProperty 'the_oldest_house.liveProofDir', project.file('build/live-proof').absolutePath
            programArguments.addAll '--username', 'OTHProofA', '--quickPlayMultiplayer', '127.0.0.1:25578', '--width', '960', '--height', '640'
        }
        proofB {
            client()
            gameDirectory = project.file('run-live/b')
            jvmArgument '-Xmx1100m'
            systemProperty 'the_oldest_house.liveProof', 'true'
            systemProperty 'the_oldest_house.liveProofRole', 'B'
            systemProperty 'org.lwjgl.system.SharedLibraryExtractPath', project.file('run-live/natives-b').absolutePath
            systemProperty 'the_oldest_house.liveProofDir', project.file('build/live-proof').absolutePath
            programArguments.addAll '--username', 'OTHProofB', '--quickPlayMultiplayer', '127.0.0.1:25578', '--width', '960', '--height', '640'
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', providers.gradleProperty('gameTestNamespaces').getOrElse(project.mod_id + ',' + project.mod_id + '_hotel,' + project.mod_id + '_literary,' + project.mod_id + '_doors,' + project.mod_id + '_seam,' + project.mod_id + '_staircase,' + project.mod_id + '_multiplayer,' + project.mod_id + '_exploration')
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neo_version,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
